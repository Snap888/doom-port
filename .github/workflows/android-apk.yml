name: Android APK

on:
  push:
    branches:
      - fix_vgp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DOOM Mobile APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package was removed from Google's SDK repository.
          # Install only platform-tools here; the next step installs pinned components.
          packages: platform-tools

      - name: Install pinned Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
          cache-read-only: false

      - name: Configure native Android build
        run: |
          cmake -S dm/android -B work/build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/29.0.14206865/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDM_GAME=doom

      - name: Build native game library and Adreno hooks
        run: |
          mkdir -p work/logs work/jni/arm64-v8a
          cmake --build work/build-android --target dm 2>&1 | tee work/logs/native-dm.log
          test -s work/build-android/libdm.so
          cp work/build-android/libdm.so work/jni/arm64-v8a/libdm.so

          cmake --build work/build-android \
            --target main_hook file_redirect_hook gsl_alloc_hook hook_impl \
            2>&1 | tee work/logs/native-hooks.log

          find work/build-android/adrenotools -type f -name '*.so' \
            -exec cp -v {} work/jni/arm64-v8a/ \;
          test -s work/jni/arm64-v8a/libdm.so

      - name: Inspect extracted APK libraries (reference only)
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin"
          python3 tools/inspect_apk_elf.py \
            --readelf "$NDK_BIN/llvm-readelf" \
            --reference vendor/decompiled-apk/arm64-v8a \
            --build work/build-android \
            --report work/logs/decompiled-elf-report.txt

      - name: Download and verify pinned Turnip driver
        run: |
          python3 tools/fetch_turnip.py --out work/driver-assets
          test -s work/driver-assets/drivers/turnip27/libvulkan_freedreno.so
          test -s work/driver-assets/drivers/turnip27/meta.json

      - name: Assemble debug APK
        run: |
          gradle --no-daemon -p dm/android :app:assembleDebug \
            -PdmGame=doom \
            -PdmAppId=org.doom.port \
            -PdmPython=python3 \
            -PdmPrebuiltJni="$GITHUB_WORKSPACE/work/jni" \
            -PdmDriverAssets="$GITHUB_WORKSPACE/work/driver-assets" \
            --console plain 2>&1 | tee work/logs/gradle-apk.log

          APK="dm/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p work
          cp "$APK" work/DOOM-Mobile-arm64-debug.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose work/DOOM-Mobile-arm64-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging work/DOOM-Mobile-arm64-debug.apk | head -n 5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DOOM-Mobile-arm64-debug-${{ github.sha }}
          path: work/DOOM-Mobile-arm64-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs-${{ github.sha }}
          path: work/logs/
          if-no-files-found: ignore
          retention-days: 7
